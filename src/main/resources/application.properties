
spring.application.name=bikestore-async

# Servidor HTTP
server.port=8080

# Conexion con RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:bikestore}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:dev12345}
spring.rabbitmq.virtual-host=/



# Simulacion de pagos BikeStore
# random = 50 % de probabilidad de fallo
# success = todos los pagos exitosos (pruebas)
# failure = todos los pagos fallidos (pruebas)
bikestore.payment.mode=random
    